{% extends "base.html" %}
{% block title %}Verse of the Day{% endblock %}
{% block content %}
  <h1>{{ translation }} Verse of the Day</h1>
  <p class="daily-verse">{{ verse }}</p>

  {% if verse_id and user_id %}
      <form method="POST" action="{{ url_for('save_verse', verse_id=verse_id, translation=translation) }}" class="save-form">
        <button type="submit" class="save-btn">⭐ Save to Favorites</button>
      </form>
  {% elif verse_id %}
      <p><a href="{{ url_for('login') }}">Login to save favorites</a></p>
  {% endif %}

  {% if user_id %}
      <p><a href="{{ url_for('favorites') }}">View My Favorites</a></p>
  {% endif %}
{% endblock %}
