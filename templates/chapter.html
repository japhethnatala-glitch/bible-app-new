{% extends "base.html" %}
{% block title %}{{ book }} {{ chapter }}{% endblock %}
{% block content %}
<h2>{{ book }} Chapter {{ chapter }} ({{ translation }})</h2>
<div style="max-height:500px; overflow-y:auto;">
  <ul class="list-group">
    {% for id, verse, text in verses %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <span><strong>{{ verse }}</strong> - {{ text }}</span>
        <form method="POST" action="{{ url_for('save_verse', verse_id=id, translation=translation) }}">
          <button type="submit" class="btn btn-sm btn-success">💾 Save</button>
        </form>
      </li>
    {% endfor %}
  </ul>
</div>
<a href="{{ url_for('chapters', translation=translation, book=book) }}" class="btn btn-secondary mt-3">⬅ Back to Chapters</a>
{% endblock %}
